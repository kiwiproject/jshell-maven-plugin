version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dev-deps:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      prod-deps:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # maven-core determines the API we compile against, and therefore the minimum
      # supported Maven version, so only take patch updates. Moving to a new minor
      # or major version of Maven is a deliberate decision.
      - dependency-name: "org.apache.maven:maven-core"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    assignees:
      - "sleberknight"
      - "chrisrohr"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 5
      semver-patch-days: 5
      semver-minor-days: 14
      semver-major-days: 30
      exclude:
        - "org.kiwiproject:*"
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-deps:
        patterns:
          - "*"
    assignees:
      - "sleberknight"
      - "chrisrohr"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
